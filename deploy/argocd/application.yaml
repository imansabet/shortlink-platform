apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: shortlink
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/imansabet/shortlink-platform.git
    targetRevision: main
    path: deploy/helm/shortlink
    helm:
       valueFiles:
        - values-argocd.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: shortlink
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
