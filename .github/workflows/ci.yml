name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: shortlink
          POSTGRES_PASSWORD: shortlink
          POSTGRES_DB: shortlink
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shortlink -d shortlink"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://shortlink:shortlink@localhost:5432/shortlink?sslmode=disable
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race -v  ./...

  image:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v6
      - name: Build image
        run: docker build -t shortlink:ci .
      - name: Smoke test
        run: |
          docker run --rm -d --name sl -p 8080:8080 shortlink:ci
          for i in $(seq 1 20); do
            curl -fs http://localhost:8080/healthz && break
            sleep 1
          done
          curl -fsS http://localhost:8080/healthz
          docker stop sl
      
  scan:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t shortlink:ci .
      - name: scan image
        uses: aquasecurity/trivy-action@master
        with: 
          image-ref: shortlink:ci
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true    
          
  
  publish: 
    needs: scan
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor  }}      
          password: ${{ secrets.GITHUB_TOKEN }} 
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true 
          tags: |
            ghcr.io/imansabet/shortlink-platform:${{ github.sha }}
            ghcr.io/imansabet/shortlink-platform:latest

  deploy:
    needs: publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - name: Bump image tag
        run: |
          sed -i "s|^  tag: .*|  tag: ${{ github.sha }}|" deploy/helm/shortlink/values-argocd.yaml
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deploy/helm/shortlink/values-argocd.yaml
          git diff --cached --quiet || git commit -m "ci: deploy ${GITHUB_SHA::7} [skip ci]"
          git push
